<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almox EsFO – Cautela de Materiais</title>
<meta name="theme-color" content="#003478">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almox EsFO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div class="loading"><div>Carregando…</div></div></div>
<dialog id="modal"></dialog>
<div id="toasts" aria-live="polite"></div>
<noscript>Ative o JavaScript para usar o Almox EsFO.</noscript>
<script>
window.__almoxErro='';
window.addEventListener('error',function(e){window.__almoxErro=(e&&e.message)||'';});
setTimeout(function(){
  var a=document.getElementById('app');
  if(a&&/Carregando/.test(a.textContent||'')&&a.children.length<=1&&!document.querySelector('.login,.shell,.m-main')){
    a.innerHTML='<div style="font-family:system-ui,sans-serif;padding:2rem;max-width:30rem;margin:auto;text-align:center">'+
      '<h2>O Almox EsFO não conseguiu abrir</h2><p>Verifique a internet e toque em "Tentar de novo". No iPhone, use o Safari atualizado (iOS 15.4 ou superior).</p>'+
      '<p><button style="padding:.7rem 1.2rem;font-size:1rem" onclick="location.reload()">Tentar de novo</button></p>'+
      '<p style="font-size:.75rem;color:#777;word-break:break-all">Informação técnica: '+(window.__almoxErro||'sem erro registrado').replace(/[<>&]/g,'')+'</p></div>';
  }
},25000);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
